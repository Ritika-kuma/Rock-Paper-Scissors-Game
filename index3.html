<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="https://thumb.silhouette-ac.com/t/6e/6e8bf918245f42321ba8d85e6081c17a_w.jpeg" alt="Rock image">
        </div>
        <div class="choice" id="paper">
            <img src="https://thumb.silhouette-ac.com/t/5c/5c3d5e32455577a92b7830e5c9c30b18_w.jpeg" alt="Paper image">
        </div>
        <div class="choice" id="Scissors">
            <img src="https://thumb.silhouette-ac.com/t/d9/d949570c3572d4173e309d96a0f9ff03_w.jpeg" alt="Scissors image">
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>you</p>
        </div>
        <div class="score">
            <p id="computer-score">0</p>
            <p>computer</p>
        </div>
    </div>

    <div class="msg-container">
        <p id="msg">play your move</p>
    </div>
    <script src="script2.js"></script>
</body>
</html>
